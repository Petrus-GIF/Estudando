<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resumo TFPM — cartão do turno</title>
    <style>
      /* Cartão do turno: cabe inteiro numa tela de celular, sem rolar.
         Abrir no celular, tirar o print e mandar no grupo.

         Cores tiradas do logo no report: teal #00877D, amarelo #E5B000 e
         o cinza #878787 do lettering. */

      :root {
        --vale-teal: #00877d;
        --vale-teal-claro: #00a49a;
        --vale-amarelo: #e5b000;
        --vale-cinza: #878787;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* precisa do !important: as linhas do pátio são flex, e o display do
         autor vence o "display: none" que o atributo hidden aplica */
      [hidden] { display: none !important; }

      body {
        display: flex;
        justify-content: center;
        background: #e8ebed;
        color: #17222b;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        padding: 8px;
        /* tema fixo: o print sai igual em qualquer celular, claro ou escuro */
        color-scheme: light;
      }

      /* O cartão ocupa a tela toda para o print não sair com sobra vazia.
         dvh acompanha a barra do navegador do celular, que aparece e some. */
      .cartao {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 390px;
        min-height: calc(100vh - 16px);
        min-height: calc(100dvh - 16px);
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(23, 34, 43, 0.15);
      }

      /* ---- cabeçalho ---- */

      .cabecalho {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 13px 16px;
        background: var(--vale-teal);
        border-bottom: 3px solid var(--vale-amarelo);
        color: #fff;
      }

      /* acompanha a largura: em tela pequena encolhe em vez de quebrar linha */
      .cabecalho h1 {
        font-size: clamp(15px, 4.5vw, 19px);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .cabecalho .quando {
        font-size: clamp(11px, 3.3vw, 14px);
        opacity: 0.85;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      /* ---- faixas ---- */

      /* as três faixas dividem a altura que sobra, em partes iguais */
      .faixa {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 12px 14px;
        border-top: 1px solid #e2e6e8;
      }
      .faixa:first-of-type { border-top: none; }

      .faixa h2 {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7d8b94;
        margin-bottom: 9px;
      }

      /* ---- destaque do realizado ---- */

      .destaque {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
      }

      .destaque .valor {
        font-size: 50px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #17222b;
      }

      .destaque .de {
        display: flex;
        flex-direction: column;
        font-size: 17px;
        color: #66757f;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .destaque .de b { color: #17222b; font-weight: 600; }

      .destaque .de small {
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #94a2aa;
      }

      /* barra de aderência à capacidade */
      .barra {
        height: 8px;
        background: #e2e6e8;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .barra i { display: block; height: 100%; background: var(--vale-teal-claro); border-radius: 3px; }

      /* ---- grades de valores ---- */

      .grade {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px 8px;
      }

      .grade.tres { grid-template-columns: repeat(3, 1fr); }

      .item .r {
        display: block;
        font-size: 10.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7d8b94;
        white-space: nowrap;
      }

      .item .v {
        display: block;
        font-size: 23px;
        font-weight: 700;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
      }

      .item .v.texto { font-size: 20px; }

      /* qualificador do valor — o "D+1" do loco em descarga e da tração */
      .item small {
        display: block;
        margin-top: 1px;
        font-size: 10.5px;
        line-height: 1.2;
        color: #94a2aa;
      }

      /* ---- pátio ---- */

      .patio {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        text-align: center;
      }

      .patio .cel {
        padding: 9px 2px;
        background: #f2f4f5;
        border-radius: 7px;
      }

      .patio .cel.zero { opacity: 0.55; }

      .patio .r {
        display: block;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #7d8b94;
      }

      .patio .v {
        display: block;
        font-size: 27px;
        font-weight: 700;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .linha {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        margin-top: 10px;
        font-size: 17px;
      }

      .linha small {
        font-size: 12.5px;
        color: #7d8b94;
      }

      .linha .r {
        font-size: 11.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7d8b94;
      }

      .pilulas { display: flex; flex-wrap: wrap; gap: 4px; }

      .pilulas b {
        padding: 3px 9px;
        background: #f2f4f5;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .buffer b { font-weight: 700; font-variant-numeric: tabular-nums; }

      /* Com observação o cartão fica apertado: a faixa toma altura fixa e o
         resto tem que caber no que sobra. Estes ajustes recuperam o espaço
         sem mudar o cartão do turno tranquilo, que é o caso comum. */
      .tem-obs .faixa { padding-top: 8px; padding-bottom: 8px; }
      .tem-obs .faixa h2 { margin-bottom: 6px; }
      .tem-obs .destaque .valor { font-size: 40px; }
      .tem-obs .destaque { margin-bottom: 6px; }
      .tem-obs .patio .v { font-size: 23px; }
      .tem-obs .patio .cel { padding: 6px 2px; }
      .tem-obs .item .v { font-size: 20px; }
      .tem-obs .item .v.texto { font-size: 18px; }
      .tem-obs .grade { gap: 7px 8px; }
      .tem-obs .linha { margin-top: 6px; }
      /* a nota do buffer quebra em duas linhas quando vem por localização */
      .tem-obs .linha small { font-size: 11.5px; line-height: 1.25; }

      /* Segunda régua de compressão. O conteúdo do turno varia — mais
         observações, notas de buffer e formação quebrando em duas linhas — e
         a primeira régua nem sempre dá conta. Aplicada por medição, só quando
         precisa, para o turno comum não pagar por um caso raro. */
      .aperta-mais .faixa { padding-top: 6px; padding-bottom: 6px; }
      .aperta-mais .faixa h2 { margin-bottom: 4px; font-size: 11px; }
      .aperta-mais .destaque .valor { font-size: 34px; }
      .aperta-mais .destaque .de { font-size: 15px; }
      .aperta-mais .patio .v { font-size: 21px; }
      .aperta-mais .patio .cel { padding: 5px 2px; }
      .aperta-mais .item .v { font-size: 18px; }
      .aperta-mais .item .v.texto { font-size: 16px; }
      .aperta-mais .item small { font-size: 10px; }
      .aperta-mais .linha { margin-top: 5px; font-size: 15px; }
      .aperta-mais .linha small { font-size: 11px; }
      .aperta-mais .pilulas b { font-size: 14px; padding: 2px 7px; }
      .aperta-mais .obs { padding: 7px 14px 8px; }
      .aperta-mais .obs ul { font-size: 12px; }

      /* Só aparece quando o turno teve complicação. Fica fora do fluxo das
         faixas (sem flex: 1) para tomar a altura que precisa e comprimir o
         resto, que é o que tem folga. */
      .obs {
        flex: none;
        padding: 9px 14px 10px;
        border-top: 1px solid #e2e6e8;
        border-left: 4px solid var(--vale-amarelo);
        background: #fff8e6;
      }

      .obs h3 {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a6d1a;
        margin-bottom: 4px;
      }

      .obs ul {
        margin: 0;
        padding-left: 15px;
        font-size: 13px;
        line-height: 1.35;
        color: #4a3d1c;
      }

      .obs li + li { margin-top: 3px; }

      /* identifica a passagem, então pesa mais que uma assinatura de rodapé */
      .rodape {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 14px 10px;
        border-top: 3px solid var(--vale-amarelo);
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #5c6a73;
      }

      /* o fundo branco do rodapé é o mesmo do PNG, então o logo assenta
         sem moldura aparente */
      .rodape img {
        width: 74px;
        height: auto;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="cartao">
      <div class="cabecalho">
        <h1>🚂 RESUMO TFPM</h1>
        <span class="quando" id="quando"></span>
      </div>

      <div class="faixa">
        <h2>Descarregamento</h2>
        <div class="destaque">
          <span class="valor" id="realizado"></span>
          <span class="de"
            ><span>de <b id="capacidade"></b></span><small>capacidade</small></span
          >
        </div>
        <div class="barra"><i id="barra"></i></div>
        <div class="grade tres">
          <span class="item"><span class="r">D+1</span><span class="v" id="d1"></span></span>
          <span class="item"><span class="r">Oferta</span><span class="v" id="oferta"></span></span>
          <span class="item"><span class="r">Ofertado</span><span class="v" id="ofertado"></span></span>
        </div>
      </div>

      <div class="faixa">
        <h2>Pátio</h2>
        <div class="patio" id="patio"></div>
        <div class="linha" id="linha-vvs" hidden>
          <span class="r">VVs</span>
          <small id="vvs-nota"></small>
        </div>
        <div class="linha" id="linha-recepcao" hidden>
          <span class="r">Recepção</span>
          <small id="recepcao-nota"></small>
        </div>
        <div class="linha">
          <span class="r">Formação</span>
          <span class="pilulas" id="formacao"></span>
          <small id="formacao-nota"></small>
        </div>
        <div class="linha buffer">
          <span class="r">Buffer</span>
          <span id="buffer"></span>
          <small id="buffer-nota"></small>
        </div>
      </div>

      <div class="faixa">
        <h2 id="titulo-tracao">Tração</h2>
        <div class="grade">
          <span class="item"
            ><span class="r">Em descarga</span><span class="v texto" id="emDescarga"></span
            ><small id="emDescarga-nota"></small
          ></span>
          <span class="item"
            ><span class="r">Tração</span><span class="v texto" id="liberado"></span
            ><small id="liberado-nota"></small
          ></span>
          <span class="item"><span class="r">Pulmão</span><span class="v" id="pulmao"></span></span>
          <span class="item"
            ><span class="r">Últ. partida</span><span class="v texto" id="ultima"></span
          ></span>
        </div>
      </div>

      <div class="obs" id="obs" hidden>
        <h3>Observações do turno</h3>
        <ul id="obs-lista"></ul>
      </div>

      /* =======================================================

      var TURNO = {
        data: "24/08/2026",
        hora: "18:49",

        // descarregamento
        d1: 39.0,
        oferta: 35.41,
        ofertado: 28.41,

      /* ================== fim dos dados ================== */

      function n(v, casas) {
        return Number(v).toLocaleString("pt-BR", {
          minimumFractionDigits: casas === undefined ? 2 : casas,
          maximumFractionDigits: casas === undefined ? 2 : casas,
        });
      }

      function dois(v) {
        return String(v).padStart(2, "0");
      }

      function texto(id, valor) {
        document.getElementById(id).textContent = valor;
      }

      texto("quando", TURNO.data + " · " + TURNO.hora);

      texto("realizado", n(TURNO.realizado));
      texto("capacidade", n(TURNO.capacidade));
      texto("d1", n(TURNO.d1));
      texto("oferta", n(TURNO.oferta));
      texto("ofertado", n(TURNO.ofertado));

      var aderencia = Math.max(0, Math.min(1, TURNO.realizado / TURNO.capacidade));
      document.getElementById("barra").style.width = (aderencia * 100).toFixed(1) + "%";

      var patio = document.getElementById("patio");
      [
        ["Recep.", TURNO.recepcao],
        ["VVs", TURNO.vvs],
        ["Class.", TURNO.classificacao],
        ["Form.", TURNO.formacaoLotes != null ? TURNO.formacaoLotes : TURNO.formacao.length],
        ["CTR", TURNO.ctr],
      ].forEach(function (par) {
        var cel = document.createElement("span");
        cel.className = "cel" + (par[1] === 0 ? " zero" : "");
        cel.innerHTML =
          '<span class="r"></span><span class="v"></span>';
        cel.querySelector(".r").textContent = par[0];
        cel.querySelector(".v").textContent = dois(par[1]);
        patio.appendChild(cel);
      });

      var formacao = document.getElementById("formacao");
      TURNO.formacao.forEach(function (t) {
        var b = document.createElement("b");
        b.textContent = t;
        formacao.appendChild(b);
      });

      if (TURNO.vvsNota) {
        texto("vvs-nota", TURNO.vvsNota);
        document.getElementById("linha-vvs").hidden = false;
      }

      if (TURNO.recepcaoNota) {
        texto("recepcao-nota", TURNO.recepcaoNota);
        document.getElementById("linha-recepcao").hidden = false;
      }

      if (TURNO.formacaoNota) texto("formacao-nota", TURNO.formacaoNota);

      texto("buffer", TURNO.gdu + " GDUs + " + TURNO.gdt + " GDTs");
      if (TURNO.bufferNota) texto("buffer-nota", TURNO.bufferNota);

      texto("titulo-tracao", "Tração " + TURNO.sentido);
      texto("emDescarga", TURNO.emDescarga);
      if (TURNO.emDescargaObs) texto("emDescarga-nota", TURNO.emDescargaObs);
      if (TURNO.liberadoObs) texto("liberado-nota", TURNO.liberadoObs);
      texto("liberado", TURNO.liberado);
      texto("pulmao", dois(TURNO.pulmao));
      texto("ultima", TURNO.ultimaPartida);

      var obs = TURNO.observacoes || [];
      if (obs.length) {
        var lista = document.getElementById("obs-lista");
        obs.forEach(function (o) {
          var li = document.createElement("li");
          li.textContent = o;
          lista.appendChild(li);
        });
        document.getElementById("obs").hidden = false;
        document.querySelector(".cartao").classList.add("tem-obs");
      }

      texto("rodape", TURNO.passagem);

      /* O print só serve se mostrar tudo. Se o conteúdo deste turno ainda
       * estourar a tela depois da primeira compressão, aperta mais um pouco
       * em vez de sair cortado. */
      var raiz = document.documentElement;
      if (raiz.scrollHeight > raiz.clientHeight) {
        document.querySelector(".cartao").classList.add("aperta-mais");
